<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>CH32V003 WebHID Monitor</title>

<style>
body {
    font-family: sans-serif;
    margin: 30px;
}

button {
    font-size: 20px;
    padding: 10px 20px;
}

#log {
    margin-top: 20px;
    padding: 10px;
    border: 1px solid #ccc;
    height: 300px;
    overflow: auto;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<h1>CH32V003 WebHID Monitor</h1>

<button id="connect">接続</button>

<div id="status">未接続</div>

<div id="log"></div>

<script>

let device;

function addLog(text)
{
    const log = document.getElementById("log");
    log.textContent += text + "\n";
    log.scrollTop = log.scrollHeight;
}

document.getElementById("connect").onclick = async () =>
{
    try
    {
        const devices = await navigator.hid.requestDevice({
            filters: [
                {
                    vendorId: 0x1209
                }
            ]
        });

        if(devices.length === 0)
        {
            addLog("デバイスが選択されませんでした");
            return;
        }

        device = devices[0];

        await device.open();

        document.getElementById("status").textContent =
            "接続: " + device.productName;

        addLog("接続成功");

        device.addEventListener("inputreport", event =>
        {
            const data = event.data;

            let bytes = [];

            for(let i=0;i<data.byteLength;i++)
            {
                bytes.push(
                    data.getUint8(i)
                        .toString(16)
                        .padStart(2, '0')
                );
            }

            addLog(bytes.join(" "));
        });

    }
    catch(e)
    {
        addLog("ERROR: " + e);
    }
};

</script>

</body>
</html>
